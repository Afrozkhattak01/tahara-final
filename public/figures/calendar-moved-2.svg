<svg class="fig" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" font-family="Archivo, system-ui, -apple-system, sans-serif">
<rect width="1600" height="880" fill="#edf3fb"/>
<text x="96" y="86" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#103f86">THE FIVE BENEFITS, CHECKED</text>
<text x="94" y="140" font-size="42" font-weight="600" letter-spacing="-0.8" fill="#03152f">Four hold up. One does not.</text>
<rect x="96" y="200" width="1408" height="584" rx="18" fill="#f9fbfd" stroke="#c6d7ed"/>
<rect x="96" y="201.0" width="4" height="114.8" fill="#afc8e3"/>
<text x="140" y="254.4" font-size="22" font-weight="600" fill="#03152f">AI literacy is now a shared responsibility</text>
<text x="140" y="284.4" font-size="16" fill="#103f86">Ensure becomes support. No standalone fine ever attached to Article 4.</text>
<rect x="1244" y="234.4" width="180" height="42" rx="21" fill="#114086" opacity="0.15"/>
<text x="1334" y="262.4" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#114086">REAL</text>
<line x1="136" y1="316.8" x2="1464" y2="316.8" stroke="#c6d7ed"/>
<rect x="96" y="317.8" width="4" height="114.8" fill="#558bbd"/>
<text x="140" y="371.2" font-size="22" font-weight="600" fill="#03152f">Post-market monitoring is more flexible</text>
<text x="140" y="401.2" font-size="16" fill="#103f86">Fewer prescribed forms. The duty to actively collect and analyse survives.</text>
<rect x="1244" y="351.2" width="180" height="42" rx="21" fill="#558bbd" opacity="0.15"/>
<text x="1334" y="379.2" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#558bbd">THINNEST</text>
<line x1="136" y1="433.6" x2="1464" y2="433.6" stroke="#c6d7ed"/>
<rect x="96" y="434.6" width="4" height="114.8" fill="#afc8e3"/>
<text x="140" y="488.0" font-size="22" font-weight="600" fill="#03152f">Lighter documentation for SMEs and small mid-caps</text>
<text x="140" y="518.0" font-size="16" fill="#103f86">Simplified template notified bodies must accept. New SMC category under 750 staff.</text>
<rect x="1244" y="468.0" width="180" height="42" rx="21" fill="#114086" opacity="0.15"/>
<text x="1334" y="496.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#114086">REAL</text>
<line x1="136" y1="550.4" x2="1464" y2="550.4" stroke="#c6d7ed"/>
<rect x="96" y="551.4" width="4" height="114.8" fill="#558bbd"/>
<text x="140" y="604.8" font-size="22" font-weight="600" fill="#03152f">Easier legal basis for bias detection</text>
<text x="140" y="634.8" font-size="16" fill="#103f86">Strict necessity reinstated after EDPB and EDPS pushback. Safeguards are cumulative.</text>
<rect x="1244" y="584.8" width="180" height="42" rx="21" fill="#558bbd" opacity="0.15"/>
<text x="1334" y="612.8" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#558bbd">NARROWER</text>
<line x1="136" y1="667.2" x2="1464" y2="667.2" stroke="#c6d7ed"/>
<rect x="96" y="668.2" width="4" height="114.8" fill="#b5651d"/>
<text x="140" y="721.6" font-size="22" font-weight="600" fill="#03152f">No EU database registration for low-risk systems</text>
<text x="140" y="751.6" font-size="16" fill="#103f86">Proposed, then rejected by both co-legislators. Simplified, still mandatory.</text>
<rect x="1244" y="701.6" width="180" height="42" rx="21" fill="#b5651d" opacity="0.15"/>
<text x="1334" y="729.6" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#b5651d">WRONG</text>
</svg>
